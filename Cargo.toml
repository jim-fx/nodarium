[workspace]
resolver = "2"
members = [
  "nodes/max/myzel/*",
  "nodes/max/plantarium/*",
  "packages/macros",
  "packages/myzel",
  "packages/types",
  "packages/utils",
]
exclude = ["nodes/max/myzel/.template", "nodes/max/plantarium/.template"]

[profile.release]
lto = true
# Tell `rustc` to optimize for small code size.
opt-level = 3
