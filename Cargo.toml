[workspace]
resolver = "2"
members = [
  "nodes/max/myzel/*",
  "nodes/max/plantarium/*",
  "packages/macros",
  "packages/myzel",
  "packages/types",
  "packages/utils",
]
exclude = ["nodes/max/myzel/.template", "nodes/max/plantarium/.template"]

[profile.release]
lto = true
opt-level = 3
# One unit lets LLVM inline and vectorize across the whole node. Slower to build, a few percent
# faster to run. `simd128` stays off globally, glam would switch to SIMD types and change the
# plants' outputs, the loops that gain enable it with `#[target_feature]`.
codegen-units = 1
