<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <meta name="color-scheme" content="light dark">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    %sveltekit.head%
    <script
      defer
      src="https://umami.max-richter.dev/script.js"
      data-website-id="585c442b-0524-4874-8955-f9853b44b17e"
      data-exclude-hash="true"
    >
    </script>
    <title>Nodes</title>
    <meta
      name="description"
      content="Nodarium is a node editor for procedural 3D plants and mushrooms that runs in the browser. Every node is a WebAssembly module written in Rust."
    >
    <link rel="alternate" type="text/plain" href="/llms.txt" title="llms.txt">
    <script>
      var store = localStorage.getItem('node-settings');
      if (store) {
        try {
          var value = JSON.parse(store);
          var themes = ['dark', 'light', 'catppuccin'];
          if (themes[value.theme]) {
            document.documentElement.classList.add('theme-' + themes[value.theme]);
          }
        } catch (e) {}
      }
    </script>
  </head>

  <body data-sveltekit-preload-data="hover">
    <noscript>
      <p>
        Nodarium is a node editor for procedural 3D plants and mushrooms. It runs in the browser and
        needs JavaScript. Without it, these files describe it: <a href="/llms.txt">llms.txt</a>, the
        <a href="/nodes/index.txt">node catalog</a>, the
        <a href="/templates/index.json">templates</a>, the
        <a href="/graph.schema.json">graph schema</a> and
        <a href="/docs/graphs.md">how to write a graph</a>.
      </p>
    </noscript>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
