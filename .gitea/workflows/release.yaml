name: 🚀 Lint & Test & Deploy

on:
  push:
    branches: ["*"]
    tags: ["*"]
  pull_request:
    branches: ["*"]

env:
  PNPM_CACHE_FOLDER: .pnpm-store
  CARGO_HOME: .cargo
  CARGO_TARGET_DIR: target

# Tag runs deploy: they share one group, so a newer tag cancels an older release and an
# older build can't be deployed last (two runners, l.asturias and l.jezerca, can finish
# out of order). Branch and PR runs only lint and test, one group per ref, so a newer
# push supersedes the older run of the same branch.
concurrency:
  group: ${{ gitea.ref_type == 'tag' && 'deploy' || gitea.ref }}
  cancel-in-progress: true

# One job on purpose: the runner executes jobs one after another, so
# separate jobs only repeat checkout, cache restore, install and build.
jobs:
  ci:
    runs-on: ubuntu-latest
    container: git.max-richter.dev/max/nodarium-ci:1f353fd6da6c79de24f8a456f7333475cac1e1ea

    steps:
      - name: 📑 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITEA_TOKEN }}

      - name: 🔧 Setup
        uses: ./.gitea/actions/setup

      - name: 🧹 Lint
        run: pnpm lint

      - name: 🎨 Format Check
        run: pnpm format:check

      - name: 🔍 Type Check
        run: pnpm check

      - name: 🛠️ Build
        run: ./.gitea/scripts/build.sh

      - name: 🧪 Unit Tests
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" pnpm test:unit

      - name: 🧪 E2E Tests
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" pnpm test:e2e

      - name: 🚀 Create Release Commit
        if: gitea.ref_type == 'tag'
        run: ./.gitea/scripts/create-release.sh
        env:
          BOT_PGP_PRIVATE_KEY: ${{ secrets.BOT_PGP_PRIVATE_KEY }}

      # the release commit bumps versions and the changelog, rebuild with them
      - name: 🛠️ Rebuild For Release
        if: gitea.ref_type == 'tag'
        run: ./.gitea/scripts/build.sh

      # a version can only be published once, so only tags publish; prepack copies the nodes
      # the rebuild made into the package
      - name: 📦 Publish @nodarium/runtime
        if: gitea.ref_type == 'tag'
        run: |
          echo "//git.max-richter.dev/api/packages/max/npm/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
          pnpm --filter @nodarium/runtime publish --no-git-checks
        env:
          NPM_TOKEN: ${{ secrets.REGISTRY_TOKEN }}

      # every push to main publishes a prerelease under the dist-tag dev, `latest` stays on the
      # tags. A newer push cancels the run of the older one (same concurrency group), so dev ends
      # on the newest commit. The release commit of nodarium-bot is pushed with the token of the
      # run, Gitea starts no workflow for it.
      - name: 📦 Publish @nodarium/runtime@dev
        if: gitea.event_name == 'push' && gitea.ref == 'refs/heads/main'
        run: |
          echo "//git.max-richter.dev/api/packages/max/npm/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
          ./.gitea/scripts/publish-dev.sh
        env:
          NPM_TOKEN: ${{ secrets.REGISTRY_TOKEN }}

      - name: 🏷️ Create Gitea Release
        if: gitea.ref_type == 'tag'
        uses: akkuman/gitea-release-action@v1
        with:
          tag_name: ${{ gitea.ref_name }}
          release_name: Release ${{ gitea.ref_name }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false

      - name: 🚀 Deploy Changed Files via rclone
        run: ./.gitea/scripts/deploy-files.sh
        env:
          REMOTE_DIR: ${{ vars.REMOTE_DIR }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}

      - name: 🔗 Comment Preview Link
        if: gitea.event_name == 'pull_request'
        continue-on-error: true
        run: ./.gitea/scripts/comment-preview.sh
        env:
          PR_NUMBER: ${{ gitea.event.pull_request.number }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
