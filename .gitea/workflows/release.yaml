name: 🚀 Lint & Test & Deploy

on:
  push:
    branches: ["*"]
    tags: ["*"]
  pull_request:
    branches: ["*"]

env:
  PNPM_CACHE_FOLDER: .pnpm-store
  CARGO_HOME: .cargo
  CARGO_TARGET_DIR: target

# One job on purpose: the runner executes jobs one after another, so
# separate jobs only repeat checkout, cache restore, install and build.
jobs:
  ci:
    runs-on: ubuntu-latest
    container: git.max-richter.dev/max/nodarium-ci:1f353fd6da6c79de24f8a456f7333475cac1e1ea

    steps:
      - name: 📑 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITEA_TOKEN }}

      - name: 🔧 Setup
        uses: ./.gitea/actions/setup

      - name: 🧹 Lint
        run: pnpm lint

      - name: 🎨 Format Check
        run: pnpm format:check

      - name: 🔍 Type Check
        run: pnpm check

      - name: 🛠️ Build
        run: ./.gitea/scripts/build.sh

      - name: 🧪 Unit Tests
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" pnpm test:unit

      - name: 🧪 E2E Tests
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" pnpm test:e2e

      - name: 🚀 Create Release Commit
        if: gitea.ref_type == 'tag'
        run: ./.gitea/scripts/create-release.sh
        env:
          BOT_PGP_PRIVATE_KEY: ${{ secrets.BOT_PGP_PRIVATE_KEY }}

      # the release commit bumps versions and the changelog, rebuild with them
      - name: 🛠️ Rebuild For Release
        if: gitea.ref_type == 'tag'
        run: ./.gitea/scripts/build.sh

      - name: 🏷️ Create Gitea Release
        if: gitea.ref_type == 'tag'
        uses: akkuman/gitea-release-action@v1
        with:
          tag_name: ${{ gitea.ref_name }}
          release_name: Release ${{ gitea.ref_name }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false

      - name: 🚀 Deploy Changed Files via rclone
        run: ./.gitea/scripts/deploy-files.sh
        env:
          REMOTE_DIR: ${{ vars.REMOTE_DIR }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
